[unix_http_server]
file=/var/run/supervisor.sock
chmod=0777

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
user=root

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:ollama]
command=/usr/local/bin/ollama serve
user=trustable
directory=/home/trustable/workspace
environment=HOME=/home/trustable/workspace
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0


[program:sshd]
command=/usr/sbin/sshd -p 2222 -D -e
directory=/
user=root
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=TERM
stopasgroup=true
killasgroup=true


[program:trustable]
command=/usr/local/bin/trustable
directory=/home/trustable
user=trustable
autostart=true
autorestart=true
startretries=10
stdout_logfile=/home/trustable/workspace/trustable.out
stdout_logfile_maxbytes=10000000
stderr_logfile=/home/trustable/workspace/trustable.err
stderr_logfile_maxbytes=10000000
stopsignal=TERM
stopasgroup=true
killasgroup=true

