<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Trustable Headroom Phase 2 routing</title>
  <desc id="desc">When Headroom is disabled OpenCode calls the configured provider directly. When enabled, only the generated provider base URL points to the loopback Headroom proxy, which forwards Authorization, model identity, streaming server-sent events, and tool calls to and from the original OpenAI-compatible provider. Relaunch replaces a verified stale proxy and joins the new launch process group. MCP servers remain directly connected to OpenCode.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 6; }
      .active { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 6; }
      .provider { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 6; }
      .label { font-family: Arial, sans-serif; font-size: 16px; fill: #0f172a; }
      .small { font-family: Arial, sans-serif; font-size: 13px; fill: #475569; }
      .line { stroke: #2563eb; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .direct { stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
      .lifecycle { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 6; }
    </style>
  </defs>

  <rect x="40" y="145" width="200" height="105" class="box"/>
  <text x="140" y="180" text-anchor="middle" class="label">OpenCode server</text>
  <text x="140" y="207" text-anchor="middle" class="small">provider/model unchanged</text>
  <text x="140" y="228" text-anchor="middle" class="small">API key unchanged</text>

  <rect x="440" y="70" width="245" height="110" class="active"/>
  <text x="562" y="105" text-anchor="middle" class="label">Headroom 0.28.0</text>
  <text x="562" y="132" text-anchor="middle" class="small">127.0.0.1:&lt;port&gt;/v1</text>
  <text x="562" y="153" text-anchor="middle" class="small">stream and tool pass-through</text>

  <rect x="855" y="70" width="225" height="110" class="provider"/>
  <text x="967" y="104" text-anchor="middle" class="label">Selected provider</text>
  <text x="967" y="131" text-anchor="middle" class="small">local Ollama / cloud</text>
  <text x="967" y="152" text-anchor="middle" class="small">api.nuvolaris.io</text>

  <rect x="440" y="280" width="245" height="90" class="box"/>
  <text x="562" y="315" text-anchor="middle" class="label">MCP servers</text>
  <text x="562" y="342" text-anchor="middle" class="small">OpenServerless and services</text>

  <path d="M240 175 C330 125, 355 125, 440 125" class="line"/>
  <text x="338" y="112" text-anchor="middle" class="small">enabled: proxy baseURL</text>
  <path d="M685 125 L855 125" class="line"/>
  <text x="770" y="94" text-anchor="middle" class="small">POST /v1/chat/completions</text>
  <text x="770" y="113" text-anchor="middle" class="small">Bearer + original model/tools</text>
  <text x="770" y="145" text-anchor="middle" class="small">SSE + streamed tool-call response</text>

  <path d="M240 225 C470 245, 675 230, 855 165" class="direct"/>
  <text x="560" y="238" text-anchor="middle" class="small">disabled: current direct route</text>

  <path d="M240 230 C330 325, 355 325, 440 325" class="direct"/>
  <text x="335" y="342" text-anchor="middle" class="small">always direct</text>

  <rect x="265" y="405" width="590" height="75" class="lifecycle"/>
  <text x="560" y="432" text-anchor="middle" class="label">Launch lifecycle</text>
  <text x="560" y="454" text-anchor="middle" class="small">enable: start in launch process group | relaunch: replace verified stale proxy</text>
  <text x="560" y="473" text-anchor="middle" class="small">disable: restore direct baseURL and start no Headroom process</text>

  <text x="40" y="35" class="label">Reversible routing invariant</text>
  <text x="40" y="58" class="small">The generated app environment is not changed. Headroom remains disabled by default; disabling restores the original provider URL exactly.</text>
</svg>
