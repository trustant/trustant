<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">OpenCode bounded browser MCP flow</title>
  <desc id="desc">OpenCode uses a low-noise Playwright MCP inside the Trustable pod with strict, indexed locator resolution to inspect the managed development server and, only after deploy, the configured Vite ingress.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #172033; }
    .title { font-size: 22px; font-weight: 700; }
    .label { font-size: 14px; font-weight: 700; }
    .small { font-size: 12px; }
    .box { fill: #f7f9fc; stroke: #72809b; stroke-width: 1.5; rx: 6; }
    .dev { fill: #eaf4ff; stroke: #2876b8; stroke-width: 1.5; rx: 6; }
    .external { fill: #fff4e5; stroke: #c87800; stroke-width: 1.5; rx: 6; }
    .arrow { stroke: #4d5b75; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#4d5b75"/>
    </marker>
  </defs>
  <text x="40" y="38" class="title">OpenCode bounded browser MCP</text>

  <rect x="40" y="90" width="180" height="82" class="box"/>
  <text x="130" y="120" text-anchor="middle" class="label">OpenCode</text>
  <text x="130" y="143" text-anchor="middle" class="small">six compact browser tools</text>

  <rect x="285" y="72" width="230" height="118" class="box"/>
  <text x="400" y="103" text-anchor="middle" class="label">trustable-browser-mcp</text>
  <text x="400" y="127" text-anchor="middle" class="small">headless Chromium + Playwright</text>
  <text x="400" y="146" text-anchor="middle" class="small">URL, aria snapshot, console, network</text>
  <text x="400" y="165" text-anchor="middle" class="small">strict locator + explicit index</text>
  <text x="400" y="184" text-anchor="middle" class="small">bounded actions and artifacts</text>

  <rect x="600" y="60" width="300" height="92" class="dev"/>
  <text x="750" y="91" text-anchor="middle" class="label">Development target</text>
  <text x="750" y="116" text-anchor="middle" class="small">http://localhost:5173</text>
  <text x="750" y="136" text-anchor="middle" class="small">managed by Trustable inside the pod</text>

  <rect x="600" y="215" width="300" height="92" class="external"/>
  <text x="750" y="246" text-anchor="middle" class="label">Deployed target</text>
  <text x="750" y="271" text-anchor="middle" class="small">&lt;protocol&gt;://vite.&lt;configured-apihost&gt;</text>
  <text x="750" y="291" text-anchor="middle" class="small">only after ops ide deploy</text>

  <path d="M220 131 H285" class="arrow"/>
  <path d="M515 112 H600" class="arrow"/>
  <path d="M515 150 C555 150 555 261 600 261" class="arrow"/>
</svg>
