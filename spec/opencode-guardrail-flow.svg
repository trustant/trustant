<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">OpenServerless guardrail flow</title>
  <desc id="desc">OpenCode reads the generated contract, edits app code, runs the checker, deploys with ops, and verifies HTTP status, content type, and body shape through pod-local localhost before optional browser-visible FQDN checks.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f5d62"/>
    </marker>
    <style>
      .box { fill: #f7f9fb; stroke: #2f5d62; stroke-width: 2; rx: 8; }
      .warn { fill: #fff8e8; stroke: #a66f00; stroke-width: 2; rx: 8; }
      .text { font-family: Arial, sans-serif; font-size: 15px; fill: #163235; }
      .small { font-family: Arial, sans-serif; font-size: 12px; fill: #425b5f; }
      .line { stroke: #2f5d62; stroke-width: 2; marker-end: url(#arrow); fill: none; }
    </style>
  </defs>
  <rect x="30" y="50" width="160" height="80" class="box"/>
  <text x="110" y="82" text-anchor="middle" class="text">OpenCode</text>
  <text x="110" y="105" text-anchor="middle" class="small">inside trustable-0</text>
  <rect x="250" y="40" width="190" height="100" class="box"/>
  <text x="345" y="72" text-anchor="middle" class="text">Read contract</text>
  <text x="345" y="96" text-anchor="middle" class="small">.openserverless-contract.md</text>
  <text x="345" y="116" text-anchor="middle" class="small">opencode.md reference</text>
  <rect x="500" y="40" width="180" height="100" class="box"/>
  <text x="590" y="72" text-anchor="middle" class="text">Edit app repo</text>
  <text x="590" y="96" text-anchor="middle" class="small">src/ packages/ public/</text>
  <text x="590" y="116" text-anchor="middle" class="small">thin wrappers</text>
  <rect x="740" y="40" width="190" height="100" class="warn"/>
  <text x="835" y="72" text-anchor="middle" class="text">Run checker</text>
  <text x="835" y="96" text-anchor="middle" class="small">scripts/check...</text>
  <text x="835" y="116" text-anchor="middle" class="small">HTML-as-JSON warnings</text>
  <rect x="260" y="220" width="170" height="80" class="box"/>
  <text x="345" y="252" text-anchor="middle" class="text">Deploy</text>
  <text x="345" y="276" text-anchor="middle" class="small">ops ide deploy/setup</text>
  <rect x="510" y="220" width="180" height="80" class="box"/>
  <text x="600" y="252" text-anchor="middle" class="text">Verify locally</text>
  <text x="600" y="276" text-anchor="middle" class="small">curl -i localhost:5173</text>
  <text x="600" y="292" text-anchor="middle" class="small">JSON vs text/html</text>
  <rect x="760" y="220" width="160" height="80" class="box"/>
  <text x="840" y="252" text-anchor="middle" class="text">Optional FQDN</text>
  <text x="840" y="276" text-anchor="middle" class="small">vite.&lt;domain&gt; after deploy</text>
  <path d="M190,90 L250,90" class="line"/>
  <path d="M440,90 L500,90" class="line"/>
  <path d="M680,90 L740,90" class="line"/>
  <path d="M835,140 C835,185 345,175 345,220" class="line"/>
  <path d="M430,260 L510,260" class="line"/>
  <path d="M690,260 L760,260" class="line"/>
</svg>
