<svg xmlns="http://www.w3.org/2000/svg" width="980" height="340" viewBox="0 0 980 340" role="img" aria-labelledby="title desc">
  <title id="title">Trustable OpenCode session history flow</title>
  <desc id="desc">Trustable reads all persistent OpenCode sessions for the active workbench and lets the user switch the embedded OpenCode iframe without losing history.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #172033; }
    .title { font-size: 22px; font-weight: 700; }
    .label { font-size: 14px; font-weight: 700; }
    .small { font-size: 12px; }
    .box { fill: #f7f9fc; stroke: #72809b; stroke-width: 1.5; rx: 6; }
    .api { fill: #eaf4ff; stroke: #2876b8; stroke-width: 1.5; rx: 6; }
    .ui { fill: #e9f8ef; stroke: #21884a; stroke-width: 1.5; rx: 6; }
    .arrow { stroke: #4d5b75; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#4d5b75"/>
    </marker>
  </defs>
  <text x="40" y="38" class="title">Persistent OpenCode session history</text>

  <rect x="40" y="95" width="190" height="88" class="box"/>
  <text x="135" y="125" text-anchor="middle" class="label">OpenCode database</text>
  <text x="135" y="149" text-anchor="middle" class="small">all root sessions retained</text>
  <text x="135" y="169" text-anchor="middle" class="small">stable project + directory</text>

  <rect x="290" y="80" width="230" height="118" class="api"/>
  <text x="405" y="111" text-anchor="middle" class="label">Trustable sessions API</text>
  <text x="405" y="135" text-anchor="middle" class="small">GET /api/opencode/sessions/&lt;app&gt;</text>
  <text x="405" y="156" text-anchor="middle" class="small">bounded to active workbench</text>
  <text x="405" y="177" text-anchor="middle" class="small">sorted by last update</text>

  <rect x="585" y="80" width="180" height="118" class="ui"/>
  <text x="675" y="111" text-anchor="middle" class="label">Sessions menu</text>
  <text x="675" y="135" text-anchor="middle" class="small">title + updated time</text>
  <text x="675" y="156" text-anchor="middle" class="small">current session marked</text>
  <text x="675" y="177" text-anchor="middle" class="small">periodic refresh</text>

  <rect x="825" y="95" width="115" height="88" class="box"/>
  <text x="882" y="125" text-anchor="middle" class="label">OpenCode</text>
  <text x="882" y="149" text-anchor="middle" class="small">iframe switches</text>
  <text x="882" y="169" text-anchor="middle" class="small">to session id</text>

  <path d="M230 139 H290" class="arrow"/>
  <path d="M520 139 H585" class="arrow"/>
  <path d="M765 139 H825" class="arrow"/>
  <path d="M882 183 C882 265 675 265 675 198" class="arrow"/>
  <text x="784" y="279" text-anchor="middle" class="small">SESSIONID cookie updated</text>
</svg>
