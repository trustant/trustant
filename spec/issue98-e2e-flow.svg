<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Issue 98 end-to-end guardrail test flow</title>
  <desc id="desc">Playwright drives Trustable, OpenCode, and Vite through FQDN hosts while kubectl exec performs pod-local guardrail checks and can optionally submit an OpenCode prompt.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 8; }
      .pod { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; rx: 10; }
      .title { font: 700 16px sans-serif; fill: #0f172a; }
      .text { font: 13px sans-serif; fill: #334155; }
      .small { font: 12px sans-serif; fill: #475569; }
      .line { stroke: #334155; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 1.4; stroke-dasharray: 5 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="24" y="24" width="872" height="382" class="pod"/>
  <text x="46" y="52" class="title">Issue 98 E2E guardrail flow</text>

  <rect x="58" y="90" width="170" height="86" class="box"/>
  <text x="82" y="120" class="title">Playwright</text>
  <text x="82" y="145" class="text">browser + API client</text>

  <rect x="318" y="64" width="210" height="74" class="box"/>
  <text x="345" y="94" class="title">trustable.&lt;domain&gt;</text>
  <text x="345" y="119" class="text">/applist.html, /api/launch</text>

  <rect x="318" y="162" width="210" height="74" class="box"/>
  <text x="345" y="192" class="title">opencode.&lt;domain&gt;</text>
  <text x="345" y="217" class="text">/project, /session, /mcp</text>

  <rect x="318" y="260" width="210" height="48" class="box"/>
  <text x="345" y="290" class="title">vite.&lt;domain&gt;</text>

  <rect x="642" y="88" width="200" height="92" class="box"/>
  <text x="670" y="118" class="title">trustable-0</text>
  <text x="670" y="143" class="text">OpenCode :4096</text>
  <text x="670" y="162" class="text">ops ide devel :5173</text>

  <rect x="642" y="220" width="200" height="82" class="box"/>
  <text x="670" y="250" class="title">pod-local checks</text>
  <text x="670" y="275" class="text">opencode.json + checker</text>

  <rect x="318" y="330" width="210" height="52" class="box"/>
  <text x="345" y="352" class="title">optional prompt</text>
  <text x="345" y="374" class="text">prompt_async + messages</text>

  <rect x="642" y="330" width="200" height="52" class="box"/>
  <text x="670" y="352" class="title">tool safety</text>
  <text x="670" y="374" class="text">no raw ops action</text>

  <path d="M228 112 C260 108 284 104 318 101" class="line"/>
  <path d="M228 140 C260 166 284 188 318 198" class="line"/>
  <path d="M228 164 C262 226 282 270 318 284" class="line"/>
  <path d="M528 102 C570 106 602 116 642 126" class="line"/>
  <path d="M528 198 C570 186 604 166 642 148" class="line"/>
  <path d="M528 284 C570 278 604 270 642 262" class="dash"/>
  <path d="M528 356 C570 356 602 356 642 356" class="dash"/>

  <text x="70" y="214" class="small">FQDN/browser-visible</text>
  <text x="70" y="234" class="small">trustable/opencode/vite hosts</text>
  <text x="70" y="274" class="small">kubectl exec is used only</text>
  <text x="70" y="294" class="small">for pod-local verification</text>
  <text x="70" y="354" class="small">Prompt step runs only with</text>
  <text x="70" y="374" class="small">TRUSTABLE_E2E_RUN_PROMPT=1</text>
</svg>
