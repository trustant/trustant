<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">Trustant git pull flow</title>
  <desc id="desc">Trustant pulls remote repository updates into the local bare workspace repository, then fast-forwards the active workbench checkout.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 8; }
      .soft { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; rx: 10; }
      .title { font: 700 16px sans-serif; fill: #0f172a; }
      .text { font: 13px sans-serif; fill: #334155; }
      .small { font: 12px sans-serif; fill: #475569; }
      .line { stroke: #334155; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 1.4; stroke-dasharray: 5 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="24" y="24" width="872" height="312" class="soft"/>
  <text x="46" y="54" class="title">Git pull from remote repository</text>

  <rect x="60" y="96" width="170" height="76" class="box"/>
  <text x="86" y="126" class="title">applist.html</text>
  <text x="86" y="151" class="text">Pull button</text>

  <rect x="310" y="74" width="210" height="88" class="box"/>
  <text x="338" y="104" class="title">/api/git/pull</text>
  <text x="338" y="129" class="text">validate clean workbench</text>
  <text x="338" y="148" class="text">fast-forward only</text>

  <rect x="620" y="58" width="210" height="76" class="box"/>
  <text x="648" y="88" class="title">remote origin</text>
  <text x="648" y="113" class="text">GitHub org/repo</text>

  <rect x="620" y="166" width="210" height="76" class="box"/>
  <text x="648" y="196" class="title">workspace bare repo</text>
  <text x="648" y="221" class="text">$WORKSPACE_DIR/workspace/app</text>

  <rect x="620" y="270" width="210" height="46" class="box"/>
  <text x="648" y="299" class="title">workbench checkout</text>

  <path d="M230 134 C260 128 280 122 310 118" class="line"/>
  <path d="M520 108 C558 100 582 96 620 94" class="line"/>
  <path d="M725 134 C724 146 724 154 724 166" class="line"/>
  <path d="M725 242 C724 254 724 260 724 270" class="line"/>
  <path d="M520 146 C560 186 582 202 620 204" class="dash"/>

  <text x="66" y="230" class="small">Dirty workbench, local-only commits,</text>
  <text x="66" y="250" class="small">or divergent history stop the pull.</text>
  <text x="66" y="286" class="small">When the workbench updates, Trustant</text>
  <text x="66" y="306" class="small">runs ops ide clean and ops ide deploy.</text>
</svg>
