<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="485" viewBox="0 0 1220 485" role="img" aria-labelledby="title desc">
  <title id="title">Trustant application test completion gate</title>
  <desc id="desc">Flow from action endpoint tracking through focused test coverage, bounded test discovery, and completion.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#343a40"/>
    </marker>
    <style>
      .box { fill: #f8f9fa; stroke: #343a40; stroke-width: 2; rx: 6; }
      .pass { fill: #e7f5ec; stroke: #237a45; stroke-width: 2; rx: 6; }
      .fail { fill: #fff0f0; stroke: #c92a2a; stroke-width: 2; rx: 6; }
      .label { font-family: Arial, sans-serif; font-size: 16px; fill: #16191d; text-anchor: middle; }
      .small { font-family: Arial, sans-serif; font-size: 13px; fill: #495057; text-anchor: middle; }
      .line { stroke: #343a40; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="box" x="20" y="150" width="170" height="100"/>
  <text class="label" x="105" y="182">Touched endpoints</text>
  <text class="small" x="105" y="207">MCP args.endpoint</text>
  <text class="small" x="105" y="229">packages source edits</text>

  <rect class="box" x="235" y="140" width="190" height="120"/>
  <text class="label" x="330" y="175">Completion request</text>
  <text class="small" x="330" y="201">deploy / setup</text>
  <text class="small" x="330" y="223">contracts / build</text>

  <rect class="box" x="470" y="105" width="210" height="190"/>
  <text class="label" x="575" y="140">Bounded discovery</text>
  <text class="small" x="575" y="170">Go: *_test.go</text>
  <text class="small" x="575" y="193">Python: test_*.py</text>
  <text class="small" x="575" y="216">JS/TS: tests + script</text>
  <text class="small" x="575" y="252">no installs, fixed limits</text>

  <rect class="box" x="725" y="115" width="210" height="170"/>
  <text class="label" x="830" y="150">Endpoint coverage</text>
  <text class="small" x="830" y="180">packages/&lt;endpoint&gt;</text>
  <text class="small" x="830" y="203">or tests/actions/&lt;endpoint&gt;</text>
  <text class="small" x="830" y="237">must be executable</text>
  <text class="small" x="830" y="259">ignore __main__.py</text>

  <rect class="box" x="980" y="35" width="210" height="100"/>
  <text class="label" x="1085" y="72">Run suites</text>
  <text class="small" x="1085" y="98">sequential + timeout</text>

  <rect class="pass" x="980" y="190" width="210" height="85"/>
  <text class="label" x="1085" y="225">PASS</text>
  <text class="small" x="1085" y="249">clear endpoints</text>

  <rect class="fail" x="980" y="335" width="210" height="85"/>
  <text class="label" x="1085" y="370">FAIL</text>
  <text class="small" x="1085" y="394">retain endpoint debt</text>

  <path class="line" d="M190 200 H235"/>
  <path class="line" d="M425 200 H470"/>
  <path class="line" d="M680 200 H725"/>
  <path class="line" d="M935 145 L980 105"/>
  <path class="line" d="M1085 135 V190"/>
  <path class="line" d="M935 255 L980 355"/>
  <text class="small" x="930" y="314">missing / failure / timeout</text>
  <text class="small" x="610" y="438">Raw ops action / wsk action commands are rejected before execution, independently of permission patterns.</text>
  <text class="small" x="610" y="456">Trustant owns ops ide login; deploy and setup remain guarded agent lifecycle operations.</text>
</svg>
