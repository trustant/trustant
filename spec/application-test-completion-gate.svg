<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-labelledby="title desc">
  <title id="title">Trustable application test completion gate</title>
  <desc id="desc">Flow from completion request through bounded test discovery and execution to pass or blocked completion.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#343a40"/>
    </marker>
    <style>
      .box { fill: #f8f9fa; stroke: #343a40; stroke-width: 2; rx: 6; }
      .pass { fill: #e7f5ec; stroke: #237a45; stroke-width: 2; rx: 6; }
      .fail { fill: #fff0f0; stroke: #c92a2a; stroke-width: 2; rx: 6; }
      .label { font-family: Arial, sans-serif; font-size: 16px; fill: #16191d; text-anchor: middle; }
      .small { font-family: Arial, sans-serif; font-size: 13px; fill: #495057; text-anchor: middle; }
      .line { stroke: #343a40; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="box" x="30" y="145" width="180" height="90"/>
  <text class="label" x="120" y="180">Completion request</text>
  <text class="small" x="120" y="205">trustable_completion_check</text>

  <rect class="box" x="270" y="130" width="210" height="120"/>
  <text class="label" x="375" y="165">Existing gates</text>
  <text class="small" x="375" y="192">deploy / setup</text>
  <text class="small" x="375" y="214">contracts / build</text>

  <rect class="box" x="540" y="95" width="220" height="190"/>
  <text class="label" x="650" y="130">Bounded discovery</text>
  <text class="small" x="650" y="160">Go: *_test.go</text>
  <text class="small" x="650" y="183">Python: test_*.py</text>
  <text class="small" x="650" y="206">JS/TS: tests + script</text>
  <text class="small" x="650" y="242">no installs, fixed limits</text>

  <rect class="box" x="820" y="35" width="190" height="100"/>
  <text class="label" x="915" y="72">Run suites</text>
  <text class="small" x="915" y="98">sequential + timeout</text>

  <rect class="pass" x="820" y="180" width="190" height="85"/>
  <text class="label" x="915" y="215">PASS</text>
  <text class="small" x="915" y="239">completion allowed</text>

  <rect class="fail" x="820" y="310" width="190" height="85"/>
  <text class="label" x="915" y="345">FAIL</text>
  <text class="small" x="915" y="369">completion blocked</text>

  <path class="line" d="M210 190 H270"/>
  <path class="line" d="M480 190 H540"/>
  <path class="line" d="M760 145 L820 100"/>
  <path class="line" d="M915 135 V180"/>
  <path class="line" d="M760 235 L820 330"/>
  <text class="small" x="785" y="276">failure / timeout / limit</text>
</svg>
