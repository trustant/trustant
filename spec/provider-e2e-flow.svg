<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc">
  <title id="title">Trustable multi-provider E2E benchmark flow</title>
  <desc id="desc">Three provider entrypoints build isolated temporary profiles, verify the effective provider identity and configuration, run the guarded Stack application test across parent and delegated OpenCode sessions, restore configuration, and report normalized checks and artifacts.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#147d92"/>
    </marker>
    <style>
      .title { font: 700 24px sans-serif; fill: #17202a; }
      .label { font: 600 15px sans-serif; fill: #17202a; }
      .small { font: 13px sans-serif; fill: #40515c; }
      .box { fill: #f7fbfc; stroke: #147d92; stroke-width: 2; rx: 6; }
      .secret { fill: #fff7e8; stroke: #bd7b16; stroke-width: 2; rx: 6; }
      .artifact { fill: #eef8f2; stroke: #24824b; stroke-width: 2; rx: 6; }
      .line { stroke: #147d92; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <text x="40" y="45" class="title">Multi-provider application E2E</text>

  <rect x="40" y="85" width="250" height="145" class="box"/>
  <text x="60" y="115" class="label">Provider entrypoint</text>
  <text x="60" y="145" class="small">BestIA local</text>
  <text x="60" y="170" class="small">Ollama Cloud</text>
  <text x="60" y="195" class="small">Regolo / api.nuvolaris.io</text>

  <rect x="370" y="85" width="270" height="145" class="secret"/>
  <text x="390" y="115" class="label">Profile-specific input</text>
  <text x="390" y="145" class="small">model + only required credential</text>
  <text x="390" y="170" class="small">BestIA clears inherited credentials</text>
  <text x="390" y="195" class="small">no invented BestIA API key</text>

  <rect x="720" y="85" width="330" height="145" class="box"/>
  <text x="740" y="115" class="label">Isolated temporary profile</text>
  <text x="740" y="145" class="small">provider, base URL, model limits</text>
  <text x="740" y="170" class="small">preflight verifies effective identity/config</text>
  <text x="740" y="195" class="small">original config restored by trap</text>

  <path d="M290 157 H370" class="line"/>
  <path d="M640 157 H720" class="line"/>

  <rect x="245" y="310" width="610" height="130" class="box"/>
  <text x="275" y="345" class="label">Guarded Stack application runner</text>
  <text x="275" y="375" class="small">OpenCode prompt: real Redis, MongoDB, PostgreSQL and S3 read/write</text>
  <text x="275" y="400" class="small">parent + task-child tools: MCP mutation, deploy, setup, completion, browser result</text>
  <path d="M885 230 V275 H550 V310" class="line"/>

  <rect x="245" y="505" width="610" height="105" class="artifact"/>
  <text x="275" y="538" class="label">benchmark-results/&lt;run-id&gt;/</text>
  <text x="275" y="565" class="small">report.json records provider/config, normalized checks, timings, and artifact paths</text>
  <text x="275" y="588" class="small">run.log + Playwright artifacts; index.jsonl + summary.tsv aggregate runs</text>
  <path d="M550 440 V505" class="line"/>
</svg>
