<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">Issue 98 session enforcement flow</title>
  <desc id="desc">OpenCode compaction automatically restores the exact active request with bounded Trustable context; diagnostic failures activate evidence-bound circuit breakers and completion checks.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #172033; }
    .title { font-size: 22px; font-weight: 700; }
    .label { font-size: 14px; font-weight: 700; }
    .small { font-size: 12px; }
    .box { fill: #f7f9fc; stroke: #72809b; stroke-width: 1.5; rx: 6; }
    .gate { fill: #fff4e5; stroke: #c87800; stroke-width: 1.5; rx: 6; }
    .ok { fill: #e9f8ef; stroke: #21884a; stroke-width: 1.5; rx: 6; }
    .arrow { stroke: #4d5b75; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#4d5b75"/>
    </marker>
  </defs>
  <text x="40" y="38" class="title">Issue 98: enforced recovery and completion</text>

  <rect x="40" y="80" width="190" height="78" class="box"/>
  <text x="135" y="108" text-anchor="middle" class="label">OpenCode session</text>
  <text x="135" y="132" text-anchor="middle" class="small">tool input + cwd/workdir</text>

  <rect x="300" y="70" width="210" height="98" class="gate"/>
  <text x="405" y="101" text-anchor="middle" class="label">Compaction event</text>
  <text x="405" y="124" text-anchor="middle" class="small">context state becomes dirty</text>
  <text x="405" y="144" text-anchor="middle" class="small">writes and deploys blocked</text>

  <rect x="580" y="70" width="230" height="98" class="box"/>
  <text x="695" y="99" text-anchor="middle" class="label">Automatic recovery packet</text>
  <text x="695" y="122" text-anchor="middle" class="small">exact task + bounded contracts</text>
  <text x="695" y="142" text-anchor="middle" class="small">sanitized config + status + map</text>

  <rect x="580" y="225" width="230" height="108" class="gate"/>
  <text x="695" y="253" text-anchor="middle" class="label">Diagnostic circuit breaker</text>
  <text x="695" y="277" text-anchor="middle" class="small">bug must be reproduced first</text>
  <text x="695" y="297" text-anchor="middle" class="small">two equal failures reopen gate</text>
  <text x="695" y="317" text-anchor="middle" class="small">evidence ID bound to revision</text>

  <rect x="300" y="235" width="210" height="88" class="box"/>
  <text x="405" y="266" text-anchor="middle" class="label">Completion check</text>
  <text x="405" y="286" text-anchor="middle" class="small">frontend + actions + build</text>
  <text x="405" y="304" text-anchor="middle" class="small">packages cwd requires deploy/setup</text>
  <text x="405" y="320" text-anchor="middle" class="small">git diff validation</text>

  <rect x="40" y="240" width="190" height="78" class="ok"/>
  <text x="135" y="268" text-anchor="middle" class="label">Verified result</text>
  <text x="135" y="292" text-anchor="middle" class="small">completion claim allowed</text>

  <path d="M230 119 H300" class="arrow"/>
  <path d="M510 119 H580" class="arrow"/>
  <path d="M695 168 V225" class="arrow"/>
  <path d="M580 279 H510" class="arrow"/>
  <path d="M300 279 H230" class="arrow"/>
  <path d="M580 110 C540 110 540 250 510 250" class="arrow"/>
  <text x="535" y="194" text-anchor="middle" class="small">recovered</text>
</svg>
