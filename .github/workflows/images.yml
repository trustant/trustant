# Builds and pushes the Trustable image on a tag push.
#
# Compilation lives in ./build.sh and ./hotfix.sh, not here, so CI and a
# developer machine produce the image exactly the same way. This workflow only
# decides which of the two to call: a tag ending in -<n> is a hotfix (a thin
# layer on the image recorded in oplugins-truinst/opsroot.json), anything else is a
# full image build.

name: Build and Push Images

on:
  push:
    tags:
      - '*_*_*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: true

          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          # opsroot.json lives in the oplugins-truinst submodule; the hotfix path
          # reads its base image from there. That repo is private, and checkout
          # clones submodules before the git-config step below runs, so the
          # token has to be supplied here.
          submodules: true
          token: ${{ secrets.TRUSTABLE_AI_REPO_ACCESS_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The image publishes to ghcr.io/trustant/trustant, which is a DIFFERENT
      # org from the one hosting this repo (trustable-ai). The default
      # GITHUB_TOKEN only grants packages:write on its own org, so it cannot
      # push there: GHCR_TOKEN must be a PAT with write:packages on `trustant`.
      # The fallback keeps older tags building until that secret exists.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure access to private trustable-ai submodules
        run: |
          git config --global \
            url."https://x-access-token:${{ secrets.TRUSTABLE_AI_REPO_ACCESS_TOKEN }}@github.com/".insteadOf \
            "https://github.com/"

      # The tag filter above matches both `..._2118` and `..._2118-1`, and
      # GHA globs have no [0-9] classes, so the two build kinds are separated
      # here rather than in `on:`.
      - name: Classify tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"
          if [[ "$TAG" =~ -[0-9]+$ ]]; then
            echo "hotfix=true" >>"$GITHUB_OUTPUT"
          else
            echo "hotfix=false" >>"$GITHUB_OUTPUT"
          fi

      # Compilation lives in the build scripts, not here, so CI and a developer
      # machine produce the image the same way.
      - name: Build hotfix image
        if: steps.tag.outputs.hotfix == 'true'
        run: bash ./hotfix.sh --buildx

      - name: Build full image
        if: steps.tag.outputs.hotfix == 'false'
        run: bash ./build.sh --buildx

