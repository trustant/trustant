# a github workflow triggered by tags in format XXXX.XXXX.XXXX with X a digit
# the workflow should checkout the sources build the binaries
# fpr gp and copy the configuration in folder image
#
# env GOOS=linux GOARCH=amd64 go build -o image/trustable-amd64
# env GOOS=linux GOARCH=arm64 go build -o image/trustable-arm64
# cp -v trustable.json image/trustable.json
#
# then build and push in the ghcr.io registri an image for linux/adm64 and linux/arm64
# named ghcr.io/<user>/<repo>:<tag> in ghcr.io with buildx
#
# use the GITHUB_TOKEN provided for authentication

name: Build and Push Images

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          env GOOS=linux GOARCH=amd64 go build -o image/trustable-amd64
          env GOOS=linux GOARCH=arm64 go build -o image/trustable-arm64
          cp -v trustable.json image/trustable.json
          cp -v opencode.md image/opencode.md

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag
        id: meta
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.tag }}
