# a github workflow triggered by tags in format XXXX.XXXX.XXXX with X a digit
# the workflow should checkout the sources build the binaries
# and copy the configuration in folder image
#
# env GOOS=linux GOARCH=amd64 go build -o image/trustable-amd64
# env GOOS=linux GOARCH=arm64 go build -o image/trustable-arm64
# cp -v trustable.json image/trustable.json
#
# then build and push in the ghcr.io registry an image for linux/adm64 and linux/arm64
# named ghcr.io/<user>/<repo>:<tag> in ghcr.io with buildx
#
# use the GITHUB_TOKEN provided for authentication

name: Build and Push Images

on:
  push:
    tags:
      - '*_*_*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:

     - name: Free Disk Space (Ubuntu)
       uses: jlumbroso/free-disk-space@main
       with:
        # this might remove tools that are actually needed,
        # if set to "true" but frees about 6 GB
        tool-cache: true

        # all of these default to true, but feel free to set to
        # "false" if necessary for your workflow
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure access to private trustable-ai submodules
        run: |
          git config --global \
            url."https://x-access-token:${{ secrets.TRUSTABLE_AI_REPO_ACCESS_TOKEN }}@github.com/".insteadOf \
            "https://github.com/"

      - name: Build binaries
        run: |
          mkdir -p image/bin
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="$(cat version.txt)"
          EXPIRY="$(cat expiry.txt)"
          echo -e "Version: ${VERSION}\nBuild: $TAG\nExpiry: $(cat expiry.txt)\n" >_build.txt
          env GOOS=linux GOARCH=amd64 go build -o image/bin/trustable-amd64
          env GOOS=linux GOARCH=arm64 go build -o image/bin/trustable-arm64
          cp -v trustable.json image/trustable.json
          cp -v opencode.md image/opencode.md
          bash image/image.sh $TAG

