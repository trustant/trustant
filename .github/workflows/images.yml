# a github workflow triggered by tags in format XXXX.XXXX.XXXX with X a digit
# the workflow should checkout the sources build the binaries
# fpr gp and copy the configuration in folder image
#
# env GOOS=linux GOARCH=amd64 go build -o image/trustable-amd64
# env GOOS=linux GOARCH=arm64 go build -o image/trustable-arm64
# cp -v trustable.json image/trustable.json
#
# then build and push in the ghcr.io registri an image for linux/adm64 and linux/arm64
# named ghcr.io/<user>/<repo>:<tag> in ghcr.io with buildx
#
# use the GITHUB_TOKEN provided for authentication

name: Build and Push Images

on:
  push:
    tags:
      - '*_*_*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod


      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build binaries
        run: |
          mkdir -p image/bin
          env GOOS=linux GOARCH=amd64 go build -o image/bin/trustable-amd64
          env GOOS=linux GOARCH=arm64 go build -o image/bin/trustable-arm64
          cp -v trustable.json image/trustable.json
          cp -v opencode.md image/opencode.md
          bash image/image.sh ${GITHUB_REF#refs/tags/}

