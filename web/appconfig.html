<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trustable - App Configuration</title>
    <script src="tailwind.js"></script>
    <script src="trustable-auth.js"></script>
    <link rel="stylesheet" href="trustable-ui.css">
</head>
<body class="min-h-screen">
    <header class="nu-topbar">
        <div class="nu-shell-wide px-4 md:px-6 py-5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div class="flex items-center gap-4 min-w-0">
                <img src="trustable-logo.svg" alt="Trustable Logo" class="w-14 h-14 shrink-0">
                <div class="min-w-0">
                    <p class="text-xs uppercase font-medium text-[color:var(--nu-muted)]">Application environment</p>
                    <h1 class="text-3xl font-light text-[color:var(--nu-ink)] truncate">Configure <span id="appNameTitle"></span></h1>
                </div>
            </div>
            <button onclick="closeConfig()" class="nu-btn nu-btn-secondary">Close</button>
        </div>
    </header>

    <main class="nu-shell-wide px-4 md:px-6 py-6">
        <!-- Env Table -->
        <div class="nu-card p-5 mb-4 overflow-x-auto">
            <table class="nu-table text-sm min-w-[760px]">
                <thead>
                    <tr>
                        <th class="text-left">Variable</th>
                        <th class="text-left">Development</th>
                        <th class="text-left">Production</th>
                        <th class="text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="envTableBody">
                    <tr><td colspan="4" class="text-center py-4 text-[color:var(--nu-muted)]">Loading...</td></tr>
                </tbody>
            </table>
            <div class="mt-4 flex flex-wrap gap-2">
                <button onclick="addVariable()"
                    class="nu-btn nu-btn-primary">
                    Add Variable
                </button>
                <button onclick="importEnvFile('development')"
                    class="nu-btn nu-btn-secondary">
                    Import .env
                </button>
                <button onclick="importEnvFile('production')"
                    class="nu-btn nu-btn-secondary">
                    Import .env.production
                </button>
                <input id="envImportFile" type="file" accept=".env,.env.production,text/plain"
                    class="hidden" onchange="handleEnvFileImport(event)">
            </div>
        </div>

        <!-- Actions -->
        <div class="flex gap-3">
            <button onclick="saveAppConfig()"
                class="nu-btn nu-btn-primary flex-1">
                Commit
            </button>
            <button onclick="closeConfig()"
                class="nu-btn nu-btn-secondary flex-1">
                Close
            </button>
        </div>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const appName = params.get('app');
        if (!appName) {
            document.body.innerHTML = '<div class="flex justify-center items-center h-screen"><p class="text-xl">No app specified</p></div>';
        }
        document.getElementById('appNameTitle').textContent = appName || '';

        let envVars = [];
        let localEnvKeys = [];
        let savedSnapshot = '';
        let envImportTarget = 'production';

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function loadAppConfig() {
            try {
                const resp = await fetch(`/api/appconfig/${encodeURIComponent(appName)}`);
                if (!resp.ok) {
                    const text = await resp.text();
                    alert('Failed to load config: ' + text);
                    return;
                }
                const data = await resp.json();
                envVars = data.vars || [];
                localEnvKeys = data.localenv_keys || [];
                savedSnapshot = JSON.stringify(envVars);
                renderTable();
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }

        function renderTable() {
            const tbody = document.getElementById('envTableBody');
            if (envVars.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-[color:var(--nu-muted)]">No variables</td></tr>';
                return;
            }

            tbody.innerHTML = envVars.map((v, i) => {
                const nameField = v.readonly
                    ? `<span class="nu-code text-xs">${escapeHtml(v.name)}</span>`
                    : v.fixed
                        ? `<span class="nu-code text-xs">${escapeHtml(v.name)}</span>`
                        : `<input type="text" value="${escapeHtml(v.name)}" onchange="updateVar(${i}, 'name', this.value)"
                            class="nu-input nu-code w-full px-2 py-1 text-xs">`;

                const devField = v.readonly
                    ? `<span class="text-xs text-[color:var(--nu-muted)]">${escapeHtml(v.dev_value)}</span>`
                    : `<input type="text" value="${escapeHtml(v.dev_value)}" onchange="updateVar(${i}, 'dev_value', this.value)"
                        class="nu-input w-full px-2 py-1 text-xs">`;

                const prodField = `<input type="text" value="${escapeHtml(v.prod_value)}" onchange="updateVar(${i}, 'prod_value', this.value)"
                    class="nu-input w-full px-2 py-1 text-xs">`;

                const removeBtn = (v.readonly || v.fixed)
                    ? ''
                    : `<button onclick="removeVar(${i})"
                        class="nu-btn nu-btn-danger nu-btn-compact">
                        Remove
                    </button>`;

                return `
                <tr>
                    <td>${nameField}</td>
                    <td>${devField}</td>
                    <td>${prodField}</td>
                    <td class="text-right">${removeBtn}</td>
                </tr>`;
            }).join('');
        }

        function updateVar(index, field, value) {
            envVars[index][field] = value;
        }

        function removeVar(index) {
            envVars.splice(index, 1);
            renderTable();
        }

        function addVariable() {
            envVars.push({ name: '', dev_value: '', prod_value: '', readonly: false, fixed: false });
            renderTable();
            // Focus the last name input
            const inputs = document.querySelectorAll('#envTableBody input[type="text"]');
            if (inputs.length > 0) {
                inputs[inputs.length - 3]?.focus();
            }
        }

        function importEnvFile(target) {
            envImportTarget = target === 'development' ? 'development' : 'production';
            document.getElementById('envImportFile').click();
        }

        function stripInlineComment(value) {
            let quote = '';
            for (let i = 0; i < value.length; i++) {
                const ch = value[i];
                if (quote) {
                    if (ch === quote && value[i - 1] !== '\\') quote = '';
                    continue;
                }
                if (ch === '"' || ch === "'") {
                    quote = ch;
                    continue;
                }
                if (ch === '#' && (i === 0 || /\s/.test(value[i - 1]))) {
                    return value.slice(0, i).trimEnd();
                }
            }
            return value.trimEnd();
        }

        function unquoteEnvValue(value) {
            const trimmed = value.trim();
            if (trimmed.length >= 2 && trimmed[0] === '"' && trimmed[trimmed.length - 1] === '"') {
                return trimmed.slice(1, -1)
                    .replace(/\\n/g, '\n')
                    .replace(/\\r/g, '\r')
                    .replace(/\\t/g, '\t')
                    .replace(/\\"/g, '"')
                    .replace(/\\\\/g, '\\');
            }
            if (trimmed.length >= 2 && trimmed[0] === "'" && trimmed[trimmed.length - 1] === "'") {
                return trimmed.slice(1, -1).replace(/\\'/g, "'");
            }
            return stripInlineComment(trimmed).trim();
        }

        function parseEnvFile(text) {
            const parsed = [];
            const seen = new Set();
            text.split(/\r?\n/).forEach((rawLine) => {
                let line = rawLine.trim();
                if (!line || line.startsWith('#')) return;
                if (line.startsWith('export ')) line = line.slice(7).trimStart();
                const eq = line.indexOf('=');
                if (eq <= 0) return;
                const name = line.slice(0, eq).trim();
                if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) return;
                const value = unquoteEnvValue(line.slice(eq + 1));
                if (seen.has(name)) {
                    const existing = parsed.find((item) => item.name === name);
                    if (existing) existing.value = value;
                } else {
                    parsed.push({ name, value });
                    seen.add(name);
                }
            });
            return parsed;
        }

        async function handleEnvFileImport(event) {
            const input = event.target;
            const file = input.files && input.files[0];
            if (!file) return;
            try {
                const entries = parseEnvFile(await file.text());
                if (entries.length === 0) {
                    alert('No variables found in ' + file.name);
                    return;
                }
                let added = 0;
                let updated = 0;
                let skippedReadonly = 0;
                const target = envImportTarget === 'development' ? 'development' : 'production';
                entries.forEach(({ name, value }) => {
                    const existing = envVars.find((item) => item.name === name);
                    if (existing) {
                        if (target === 'development') {
                            if (existing.readonly) {
                                skippedReadonly++;
                                return;
                            }
                            existing.dev_value = value;
                        } else {
                            existing.prod_value = value;
                        }
                        updated++;
                    } else {
                        envVars.push({
                            name,
                            dev_value: target === 'development' ? value : '',
                            prod_value: target === 'production' ? value : '',
                            readonly: false,
                            fixed: false
                        });
                        added++;
                    }
                });
                renderTable();
                const targetLabel = target === 'development' ? '.env' : '.env.production';
                const skippedSummary = skippedReadonly ? `, ${skippedReadonly} read-only development values skipped` : '';
                alert(`Imported ${entries.length} variables from ${file.name} into ${targetLabel} (${updated} updated, ${added} added${skippedSummary}).`);
            } catch (e) {
                alert('Failed to import .env: ' + e.message);
            } finally {
                input.value = '';
            }
        }

        async function saveAppConfig() {
            try {
                const resp = await fetch(`/api/appconfig/${encodeURIComponent(appName)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ vars: envVars })
                });
                if (resp.ok) {
                    savedSnapshot = JSON.stringify(envVars);
                    alert('Configuration saved');
                } else {
                    const text = await resp.text();
                    alert('Failed to save: ' + text);
                }
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }

        function hasUnsavedChanges() {
            return JSON.stringify(envVars) !== savedSnapshot;
        }

        function closeConfig() {
            if (hasUnsavedChanges()) {
                if (!confirm('You have unsaved changes. Are you sure you want to close?')) {
                    return;
                }
            }
            window.location.href = 'applist.html';
        }

        // Check version then load
        (async function() {
            // Guard: no provider configured -> send user to provider selection
            try {
                const cfgResp = await fetch('/api/configuration');
                const cfg = await cfgResp.json();
                if (!cfg || !cfg.provider) {
                    window.location.href = 'index.html';
                    return;
                }
            } catch (e) {
                window.location.href = 'index.html';
                return;
            }

            try {
                const resp = await fetch('/api/version');
                const data = await resp.json();
                if (data.expired) {
                    document.body.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100vh;"><p style="font-size:1.5rem;text-align:center;">This version expired. Please Update. For info email: info@nuvolaris.io</p></div>';
                    return;
                }
            } catch (e) {
                console.error('Failed to check version:', e);
            }
            if (appName) loadAppConfig();
        })();
    </script>
</body>
</html>
