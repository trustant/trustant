<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trustable - Configuration</title>
    <script src="tailwind.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-4">
    <div class="w-full max-w-2xl">
        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-3">
                <img src="trustable-logo.svg" alt="Trustable Logo" class="w-12 h-12">
                <h1 class="text-2xl font-bold text-gray-800">Configuration</h1>
            </div>
            <a href="applist.html" class="px-4 py-2 border border-gray-300 rounded-md hover:bg-gray-50 transition-colors">Back</a>
        </div>

        <!-- Ollama Models -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-semibold">Ollama Models</h2>
                <button onclick="showAddModelModal()"
                    class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors text-sm">
                    Add Model
                </button>
            </div>
            <table class="w-full text-sm">
                <thead>
                    <tr class="border-b">
                        <th class="text-left py-2 px-2">Model</th>
                        <th class="text-left py-2 px-2">Context Size</th>
                        <th class="text-right py-2 px-2">Actions</th>
                    </tr>
                </thead>
                <tbody id="modelTableBody">
                    <tr><td colspan="3" class="text-center py-4 text-gray-500">Loading...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- OpenCode Models -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">OpenCode Models</h2>
            <div class="space-y-3">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Default Model</label>
                    <input type="text" id="opencodeDefault"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Small Model</label>
                    <input type="text" id="opencodeSmall"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>
            </div>
        </div>

        <!-- Git User -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">Git User</h2>
            <div class="space-y-3">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">User Name</label>
                    <input type="text" id="gitUser"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="text" id="gitEmail"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="flex gap-3">
            <button onclick="saveAndConfigure()"
                class="flex-1 px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 transition-colors">
                Save &amp; Configure
            </button>
        </div>
    </div>

    <!-- Add Model Modal -->
    <div id="addModelModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md mx-4">
            <h3 class="text-lg font-semibold mb-4">Add Model</h3>
            <div class="space-y-3">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Model Name</label>
                    <input type="text" id="newModelName" placeholder="e.g. qwen3-coder:480b-cloud"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Context Size</label>
                    <input type="text" id="newModelContext" placeholder="e.g. 256K"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>
            </div>
            <div class="flex gap-3 mt-4">
                <button onclick="hideAddModelModal()"
                    class="flex-1 px-4 py-2 border border-gray-300 rounded-md hover:bg-gray-50 transition-colors">
                    Cancel
                </button>
                <button onclick="addModel()"
                    class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors">
                    Add
                </button>
            </div>
        </div>
    </div>

    <script>
        let config = { ollama: {}, opencode: { default: '', small: '' } };

        async function loadConfig() {
            try {
                const resp = await fetch('/api/configuration');
                config = await resp.json();
                renderModels();
                document.getElementById('opencodeDefault').value = config.opencode?.default || '';
                document.getElementById('opencodeSmall').value = config.opencode?.small || '';
                document.getElementById('gitUser').value = config.git?.user || '';
                document.getElementById('gitEmail').value = config.git?.email || '';
            } catch (e) {
                console.error('Failed to load config:', e);
            }
        }

        function renderModels() {
            const tbody = document.getElementById('modelTableBody');
            const models = config.ollama || {};
            const keys = Object.keys(models);
            if (keys.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="text-center py-4 text-gray-500">No models configured</td></tr>';
                return;
            }
            tbody.innerHTML = keys.map(name => `
                <tr class="border-b">
                    <td class="py-2 px-2 font-mono text-xs">${escapeHtml(name)}</td>
                    <td class="py-2 px-2">${escapeHtml(models[name])}</td>
                    <td class="py-2 px-2 text-right">
                        <button onclick="removeModel('${escapeAttr(name)}')"
                            class="px-2 py-1 bg-red-600 text-white text-xs rounded hover:bg-red-700 transition-colors">
                            Remove
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function escapeAttr(text) {
            return text.replace(/'/g, "\\'").replace(/"/g, '\\"');
        }

        function showAddModelModal() {
            document.getElementById('newModelName').value = '';
            document.getElementById('newModelContext').value = '';
            document.getElementById('addModelModal').classList.remove('hidden');
            document.getElementById('addModelModal').classList.add('flex');
            document.getElementById('newModelName').focus();
        }

        function hideAddModelModal() {
            document.getElementById('addModelModal').classList.add('hidden');
            document.getElementById('addModelModal').classList.remove('flex');
        }

        function addModel() {
            const name = document.getElementById('newModelName').value.trim();
            const ctx = document.getElementById('newModelContext').value.trim();
            if (!name || !ctx) {
                alert('Both model name and context size are required');
                return;
            }
            if (!config.ollama) config.ollama = {};
            config.ollama[name] = ctx;
            renderModels();
            hideAddModelModal();
        }

        function removeModel(name) {
            if (config.ollama) {
                delete config.ollama[name];
                renderModels();
            }
        }

        function buildConfig() {
            return {
                ollama: config.ollama || {},
                testmodel: config.testmodel || '',
                opencode: {
                    default: document.getElementById('opencodeDefault').value.trim(),
                    small: document.getElementById('opencodeSmall').value.trim()
                },
                git: {
                    user: document.getElementById('gitUser').value.trim(),
                    email: document.getElementById('gitEmail').value.trim()
                },
                env: config.env || {},
                apps: config.apps || {}
            };
        }

        async function saveAndConfigure() {
            const cfg = buildConfig();
            // Save first
            try {
                const resp = await fetch('/api/configuration', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(cfg)
                });
                if (!resp.ok) {
                    const text = await resp.text();
                    alert('Failed to save: ' + text);
                    return;
                }
            } catch (e) {
                alert('Error saving: ' + e.message);
                return;
            }

            // Redirect to index.html which runs the full configuration flow
            window.location.href = 'index.html';
        }

        // Close modals on escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                hideAddModelModal();
            }
        });

        document.getElementById('addModelModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) hideAddModelModal();
        });

        // Check version
        (async function() {
            try {
                const resp = await fetch('/api/version');
                const data = await resp.json();
                if (data.expired) {
                    document.body.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100vh;"><p style="font-size:1.5rem;text-align:center;">This version expired. Please get an updated version. For info email: info@nuvolaris.io</p></div>';
                    return;
                }
            } catch (e) {
                console.error('Failed to check version:', e);
            }
            loadConfig();
        })();
    </script>
</body>
</html>
