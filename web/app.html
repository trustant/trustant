<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trustable App</title>
    <script src="tailwind.js"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-gray-100 h-full flex flex-col">
    <!-- Top Bar (10% height) -->
    <div class="h-[10%] bg-white shadow-md flex items-center justify-between px-4">
        <div class="flex items-center gap-3 h-full">
            <img src="trustable-logo.svg" alt="Trustable Logo" class="h-[80%] w-auto">
            <h1 id="appName" class="text-xl font-bold text-gray-800"></h1>
        </div>
        <div class="flex items-center gap-3">
            <button id="publishBtn" onclick="showPublishModal()"
                class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed">
                Publish
            </button>
            <button onclick="triggerUpload()"
                class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 transition-colors">
                Upload
            </button>
            <input type="file" id="fileInput" class="hidden" onchange="handleFileUpload(event)">
            <button onclick="goBack()"
                class="px-4 py-2 bg-gray-600 text-white rounded-md hover:bg-gray-700 transition-colors">
                Back
            </button>
        </div>
    </div>

    <!-- Body with two iframes (90% height), resizable horizontally -->
    <div id="iframeContainer" class="h-[90%] flex">
        <iframe id="leftFrame" class="h-full border-r border-gray-300" style="width: 50%; min-width: 100px;"></iframe>
        <div id="divider" class="w-1.5 bg-gray-300 hover:bg-blue-400 cursor-col-resize flex-shrink-0 transition-colors"></div>
        <iframe id="rightFrame" class="h-full flex-1" style="min-width: 100px;"></iframe>
    </div>

    <!-- Publish Confirmation Modal -->
    <div id="publishModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md mx-4 text-center">
            <div id="publishSpinner" class="mb-4 hidden">
                <svg class="animate-spin h-12 w-12 text-blue-600 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </div>
            <h3 id="publishTitle" class="text-lg font-semibold mb-2">Publish Application</h3>
            <p id="publishMessage" class="text-gray-600 mb-4">Are you sure you want to publish to <span id="publishApiHost" class="font-semibold"></span>?</p>
            <div id="publishConfirmButtons" class="flex gap-3">
                <button onclick="hidePublishModal()"
                    class="flex-1 px-4 py-2 border border-gray-300 rounded-md hover:bg-gray-50 transition-colors">
                    Cancel
                </button>
                <button onclick="confirmPublish()"
                    class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors">
                    Publish
                </button>
            </div>
            <div id="publishResult" class="hidden">
                <p id="publishResultText" class="mb-4"></p>
                <button onclick="hidePublishModal()"
                    class="px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors">
                    Continue
                </button>
            </div>
        </div>
    </div>

    <!-- Upload Modal -->
    <div id="uploadModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md mx-4 text-center">
            <div id="uploadSpinner" class="mb-4 hidden">
                <svg class="animate-spin h-12 w-12 text-green-600 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p class="mt-2 text-gray-600">Uploading...</p>
            </div>
            <div id="uploadResult" class="hidden">
                <h3 class="text-lg font-semibold mb-2">File Uploaded</h3>
                <p class="text-gray-600 mb-2">File path:</p>
                <div class="flex items-center gap-2 mb-4">
                    <input type="text" id="uploadedFilePath" readonly
                        class="flex-1 px-3 py-2 border border-gray-300 rounded-md bg-gray-50 text-sm font-mono">
                    <button onclick="copyFilePath()"
                        class="px-3 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 transition-colors"
                        title="Copy to clipboard">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                        </svg>
                    </button>
                </div>
                <p id="copyFeedback" class="text-green-600 text-sm mb-2 hidden">Copied to clipboard!</p>
                <button onclick="hideUploadModal()"
                    class="px-6 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 transition-colors">
                    Close
                </button>
            </div>
            <div id="uploadError" class="hidden">
                <h3 class="text-lg font-semibold mb-2 text-red-600">Upload Failed</h3>
                <p id="uploadErrorText" class="text-red-600 mb-4"></p>
                <button onclick="hideUploadModal()"
                    class="px-6 py-2 bg-gray-600 text-white rounded-md hover:bg-gray-700 transition-colors">
                    Close
                </button>
            </div>
        </div>
    </div>

    <script>
        // Read cookies
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return decodeURIComponent(parts.pop().split(';').shift());
            return null;
        }

        function base64Decode(value) {
            const binary = atob(value.replace(/-/g, '+').replace(/_/g, '/'));
            const bytes = Uint8Array.from(binary, (c) => c.charCodeAt(0));
            return new TextDecoder().decode(bytes);
        }

        const leftURL = getCookie('LEFT');
        const rightURL = getCookie('RIGHT');
        const appName = getCookie('NAME');
        const urlDirectory = getCookie('URLDIR');
        const apiHost = getCookie('APIHOST');

        console.log('URLDIR:', urlDirectory);

        // Set app name in title bar
        document.getElementById('appName').textContent = appName || 'Unknown App';
        document.title = `Trustable - ${appName || 'App'}`;

        // Configure iframes with LEFT and RIGHT URLs
        if (leftURL) {
            if (urlDirectory) {
                document.getElementById('leftFrame').src = `${leftURL}/session/?directory=${urlDirectory}`;
            } else {
                document.getElementById('leftFrame').src = `${leftURL}/`;
            }
        }
        if (rightURL) {
            document.getElementById('rightFrame').src = rightURL;
        }

        // Disable publish button if APIHOST is not defined
        const publishBtn = document.getElementById('publishBtn');
        if (!apiHost) {
            publishBtn.disabled = true;
            publishBtn.title = 'No API Host configured';
        }

        // Set the API host in the modal
        document.getElementById('publishApiHost').textContent = apiHost || '';

        function showPublishModal() {
            document.getElementById('publishSpinner').classList.add('hidden');
            document.getElementById('publishTitle').textContent = 'Publish Application';
            document.getElementById('publishMessage').classList.remove('hidden');
            document.getElementById('publishConfirmButtons').classList.remove('hidden');
            document.getElementById('publishResult').classList.add('hidden');
            document.getElementById('publishModal').classList.remove('hidden');
            document.getElementById('publishModal').classList.add('flex');
        }

        function hidePublishModal() {
            document.getElementById('publishModal').classList.add('hidden');
            document.getElementById('publishModal').classList.remove('flex');
        }

        async function confirmPublish() {
            // Show loading state
            document.getElementById('publishSpinner').classList.remove('hidden');
            document.getElementById('publishMessage').classList.add('hidden');
            document.getElementById('publishConfirmButtons').classList.add('hidden');

            try {
                const response = await fetch('/api/publish', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: appName })
                });

                const data = await response.json();
                document.getElementById('publishSpinner').classList.add('hidden');

                if (response.ok && !data.error) {
                    document.getElementById('publishResultText').textContent = data.message || data.output || 'Published successfully';
                    document.getElementById('publishResultText').className = 'mb-4 text-green-600';
                } else {
                    document.getElementById('publishResultText').textContent = data.error || data.message || 'Publish failed';
                    document.getElementById('publishResultText').className = 'mb-4 text-red-600';
                }
                document.getElementById('publishResult').classList.remove('hidden');
            } catch (error) {
                document.getElementById('publishSpinner').classList.add('hidden');
                document.getElementById('publishResultText').textContent = error.message;
                document.getElementById('publishResultText').className = 'mb-4 text-red-600';
                document.getElementById('publishResult').classList.remove('hidden');
            }
        }

        async function goBack() {
            document.cookie = 'B64DIR=;path=/;expires=Thu, 01 Jan 1970 00:00:00 GMT';
            try {
                await fetch('/api/launch', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' }
                });
            } catch (error) {
                console.error('Failed to stop app:', error);
            }
            window.location.href = 'index.html';
        }

        // Upload functions
        function triggerUpload() {
            document.getElementById('fileInput').click();
        }

        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Reset the file input so the same file can be uploaded again
            event.target.value = '';

            // Show modal with spinner
            showUploadModal();

            try {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('name', appName);

                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const filePath = await response.text();
                    document.getElementById('uploadSpinner').classList.add('hidden');
                    document.getElementById('uploadedFilePath').value = filePath;
                    document.getElementById('uploadResult').classList.remove('hidden');
                } else {
                    const errorText = await response.text();
                    document.getElementById('uploadSpinner').classList.add('hidden');
                    document.getElementById('uploadErrorText').textContent = errorText || 'Upload failed';
                    document.getElementById('uploadError').classList.remove('hidden');
                }
            } catch (error) {
                document.getElementById('uploadSpinner').classList.add('hidden');
                document.getElementById('uploadErrorText').textContent = error.message;
                document.getElementById('uploadError').classList.remove('hidden');
            }
        }

        function showUploadModal() {
            document.getElementById('uploadSpinner').classList.remove('hidden');
            document.getElementById('uploadResult').classList.add('hidden');
            document.getElementById('uploadError').classList.add('hidden');
            document.getElementById('copyFeedback').classList.add('hidden');
            document.getElementById('uploadModal').classList.remove('hidden');
            document.getElementById('uploadModal').classList.add('flex');
        }

        function hideUploadModal() {
            document.getElementById('uploadModal').classList.add('hidden');
            document.getElementById('uploadModal').classList.remove('flex');
        }

        async function copyFilePath() {
            const filePath = document.getElementById('uploadedFilePath').value;
            try {
                await navigator.clipboard.writeText(filePath);
                document.getElementById('copyFeedback').classList.remove('hidden');
                setTimeout(() => {
                    document.getElementById('copyFeedback').classList.add('hidden');
                }, 2000);
            } catch (error) {
                // Fallback for older browsers
                document.getElementById('uploadedFilePath').select();
                document.execCommand('copy');
                document.getElementById('copyFeedback').classList.remove('hidden');
                setTimeout(() => {
                    document.getElementById('copyFeedback').classList.add('hidden');
                }, 2000);
            }
        }

        // Close modal on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                // Only close publish modal if result is showing (has Continue button)
                if (!document.getElementById('publishResult').classList.contains('hidden')) {
                    hidePublishModal();
                }
                // Close upload modal if result or error is showing
                if (!document.getElementById('uploadResult').classList.contains('hidden') ||
                    !document.getElementById('uploadError').classList.contains('hidden')) {
                    hideUploadModal();
                }
            }
        });

        // Close modal on backdrop click
        document.getElementById('publishModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                // Only close if result is showing or confirm buttons are visible
                if (!document.getElementById('publishResult').classList.contains('hidden') ||
                    !document.getElementById('publishConfirmButtons').classList.contains('hidden')) {
                    hidePublishModal();
                }
            }
        });

        document.getElementById('uploadModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                // Only close if result or error is showing (not during upload)
                if (!document.getElementById('uploadResult').classList.contains('hidden') ||
                    !document.getElementById('uploadError').classList.contains('hidden')) {
                    hideUploadModal();
                }
            }
        });

        // Resizable divider between iframes
        (function() {
            const divider = document.getElementById('divider');
            const container = document.getElementById('iframeContainer');
            const leftFrame = document.getElementById('leftFrame');
            const rightFrame = document.getElementById('rightFrame');
            let isDragging = false;

            divider.addEventListener('mousedown', (e) => {
                isDragging = true;
                e.preventDefault();
                // Disable pointer events on iframes while dragging
                leftFrame.style.pointerEvents = 'none';
                rightFrame.style.pointerEvents = 'none';
                divider.classList.add('bg-blue-500');
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const rect = container.getBoundingClientRect();
                const dividerWidth = divider.offsetWidth;
                const offset = e.clientX - rect.left;
                const minWidth = 100;
                const maxWidth = rect.width - dividerWidth - minWidth;
                const newWidth = Math.max(minWidth, Math.min(offset, maxWidth));
                leftFrame.style.width = newWidth + 'px';
            });

            document.addEventListener('mouseup', () => {
                if (!isDragging) return;
                isDragging = false;
                leftFrame.style.pointerEvents = '';
                rightFrame.style.pointerEvents = '';
                divider.classList.remove('bg-blue-500');
            });
        })();
    </script>
</body>
</html>
