<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trustable</title>
    <script src="tailwind.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Centered Logo and Title -->
        <div class="flex flex-col items-center mb-8">
            <img src="trustable-logo.svg" alt="Trustable Logo" class="w-32 h-32">
            <h1 class="text-2xl font-bold text-gray-800 mt-4">Trustable</h1>
        </div>

        <!-- Applications List -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-semibold">Applications</h2>
                <button onclick="showAddModal()"
                    class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors">
                    Add App
                </button>
            </div>
            <div id="appList" class="space-y-3">
                <p class="text-gray-500 text-center py-4">Loading...</p>
            </div>
        </div>
    </div>

    <!-- Add Application Modal -->
    <div id="addModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md mx-4">
            <h3 class="text-lg font-semibold mb-4">Add Application</h3>
            <form id="addAppForm" class="space-y-4">
                <div>
                    <label for="appName" class="block text-sm font-medium text-gray-700 mb-1">Application Name</label>
                    <input type="text" id="appName" required
                        pattern="[a-zA-Z][a-zA-Z0-9]{5,19}"
                        title="Must start with a letter, contain only alphanumeric characters, and be 6-20 characters long"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <p class="text-xs text-gray-500 mt-1">6-20 alphanumeric characters, starting with a letter</p>
                </div>
                <div>
                    <label for="appPassword" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="appPassword" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label for="appRepo" class="block text-sm font-medium text-gray-700 mb-1">GitHub Repository</label>
                    <input type="text" id="appRepo" required
                        placeholder="org/repo"
                        pattern="[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+"
                        title="Format: org/repo (e.g., nuvolaris/trustable-workspace)"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <p class="text-xs text-gray-500 mt-1">Format: org/repo</p>
                </div>
                <div>
                    <label for="appApiHost" class="block text-sm font-medium text-gray-700 mb-1">Public API Host (optional)</label>
                    <input type="text" id="appApiHost"
                        placeholder="api.example.com"
                        value="nuvolaris.org"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <p class="text-xs text-gray-500 mt-1">Optional: hostname of your OpenWhisk instance</p>
                </div>
                <div class="flex gap-3">
                    <button type="button" onclick="hideAddModal()"
                        class="flex-1 px-4 py-2 border border-gray-300 rounded-md hover:bg-gray-50 transition-colors">
                        Cancel
                    </button>
                    <button type="submit"
                        class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors">
                        Add
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md mx-4">
            <h3 class="text-lg font-semibold mb-4">Confirm Delete</h3>
            <p class="text-gray-600 mb-6">Are you sure you want to delete "<span id="deleteAppName"></span>"?</p>
            <div class="flex gap-3">
                <button onclick="hideDeleteModal()"
                    class="flex-1 px-4 py-2 border border-gray-300 rounded-md hover:bg-gray-50 transition-colors">
                    Cancel
                </button>
                <button onclick="confirmDelete()"
                    class="flex-1 px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700 transition-colors">
                    Delete
                </button>
            </div>
        </div>
    </div>

    <!-- Launching Modal -->
    <div id="launchModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md mx-4 text-center">
            <div id="launchSpinner" class="mb-4">
                <svg class="animate-spin h-12 w-12 text-blue-600 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </div>
            <h3 id="launchTitle" class="text-lg font-semibold mb-2">Launching <span id="launchAppName"></span></h3>
            <p id="launchMessage" class="text-gray-600 mb-4">Please wait...</p>
            <div id="launchError" class="hidden">
                <p id="launchErrorText" class="text-red-600 mb-4"></p>
                <button onclick="hideLaunchModal()"
                    class="px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors">
                    Continue
                </button>
            </div>
        </div>
    </div>

    <script>
        let appToDelete = null;

        function showAddModal() {
            document.getElementById('addModal').classList.remove('hidden');
            document.getElementById('addModal').classList.add('flex');
            document.getElementById('appName').focus();
        }

        function hideAddModal() {
            document.getElementById('addModal').classList.add('hidden');
            document.getElementById('addModal').classList.remove('flex');
            document.getElementById('addAppForm').reset();
        }

        function showDeleteModal(name) {
            appToDelete = name;
            document.getElementById('deleteAppName').textContent = name;
            document.getElementById('deleteModal').classList.remove('hidden');
            document.getElementById('deleteModal').classList.add('flex');
        }

        function hideDeleteModal() {
            document.getElementById('deleteModal').classList.add('hidden');
            document.getElementById('deleteModal').classList.remove('flex');
            appToDelete = null;
        }

        async function loadApps() {
            try {
                const response = await fetch('/api/repo');
                const apps = await response.json();
                renderApps(apps);
            } catch (error) {
                console.error('Failed to load apps:', error);
                document.getElementById('appList').innerHTML =
                    '<p class="text-red-500 text-center py-4">Failed to load applications</p>';
            }
        }

        function renderApps(apps) {
            const appList = document.getElementById('appList');
            if (!apps || apps.length === 0) {
                appList.innerHTML = '<p class="text-gray-500 text-center py-4">No applications yet</p>';
                return;
            }

            appList.innerHTML = apps.map(app => `
                <div class="flex items-center justify-between p-3 bg-gray-50 rounded-md">
                    <div class="flex-1 min-w-0 mr-3">
                        <h3 class="font-medium truncate">${escapeHtml(app.name)}</h3>
                        <p class="text-sm text-gray-500 truncate">${escapeHtml(app.repo)}</p>
                        ${app.apihost ? `<a href="https://${escapeHtml(app.name)}.${escapeHtml(app.apihost)}" target="_blank" class="text-xs text-blue-600 hover:underline truncate block">${escapeHtml(app.name)}.${escapeHtml(app.apihost)}</a>` : ''}
                    </div>
                    <div class="flex gap-2 flex-shrink-0">
                        <button onclick="launchApp('${escapeAttr(app.name)}')"
                            class="px-3 py-1 bg-green-600 text-white text-sm rounded hover:bg-green-700 transition-colors">
                            Launch
                        </button>
                        <button onclick="showDeleteModal('${escapeAttr(app.name)}')"
                            class="px-3 py-1 bg-red-600 text-white text-sm rounded hover:bg-red-700 transition-colors">
                            Delete
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function escapeAttr(text) {
            return text.replace(/'/g, "\\'").replace(/"/g, '\\"');
        }

        async function addApp(event) {
            event.preventDefault();
            const name = document.getElementById('appName').value.trim();
            const password = document.getElementById('appPassword').value.trim();
            const repo = document.getElementById('appRepo').value.trim();
            const apihost = document.getElementById('appApiHost').value.trim();

            const payload = { name, password, repo };
            if (apihost) {
                payload.apihost = apihost;
            }

            try {
                const response = await fetch('/api/repo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    hideAddModal();
                    loadApps();
                } else {
                    const error = await response.text();
                    alert('Failed to add application: ' + error);
                }
            } catch (error) {
                alert('Failed to add application: ' + error.message);
            }
        }

        async function confirmDelete() {
            if (!appToDelete) return;

            try {
                const response = await fetch('/api/repo', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: appToDelete })
                });

                if (response.ok) {
                    hideDeleteModal();
                    loadApps();
                } else {
                    const error = await response.text();
                    alert('Failed to delete application: ' + error);
                }
            } catch (error) {
                alert('Failed to delete application: ' + error.message);
            }
        }

        function showLaunchModal(name) {
            document.getElementById('launchAppName').textContent = name;
            document.getElementById('launchSpinner').classList.remove('hidden');
            document.getElementById('launchMessage').classList.remove('hidden');
            document.getElementById('launchError').classList.add('hidden');
            document.getElementById('launchModal').classList.remove('hidden');
            document.getElementById('launchModal').classList.add('flex');
        }

        function showLaunchError(error) {
            document.getElementById('launchSpinner').classList.add('hidden');
            document.getElementById('launchMessage').classList.add('hidden');
            document.getElementById('launchErrorText').textContent = error;
            document.getElementById('launchError').classList.remove('hidden');
        }

        function hideLaunchModal() {
            document.getElementById('launchModal').classList.add('hidden');
            document.getElementById('launchModal').classList.remove('flex');
        }

        async function launchApp(name) {
            showLaunchModal(name);

            try {
                const response = await fetch(`/api/launch/${encodeURIComponent(name)}`);
                const data = await response.json();

                if (data.error) {
                    showLaunchError(data.error);
                    return;
                }

                // Save ports and name in cookies
                document.cookie = `LEFT=${data.left};path=/`;
                document.cookie = `RIGHT=${data.right};path=/`;
                document.cookie = `NAME=${encodeURIComponent(name)};path=/`;

                window.location.href = 'app.html';
            } catch (error) {
                showLaunchError(error.message);
            }
        }

        // Close modals on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                hideAddModal();
                hideDeleteModal();
                // Only close launch modal if error is showing (has Continue button)
                if (!document.getElementById('launchError').classList.contains('hidden')) {
                    hideLaunchModal();
                }
            }
        });

        // Close modals on backdrop click
        document.getElementById('addModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) hideAddModal();
        });
        document.getElementById('deleteModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) hideDeleteModal();
        });
        document.getElementById('launchModal').addEventListener('click', (e) => {
            // Only close launch modal on backdrop click if error is showing
            if (e.target === e.currentTarget && !document.getElementById('launchError').classList.contains('hidden')) {
                hideLaunchModal();
            }
        });

        document.getElementById('addAppForm').addEventListener('submit', addApp);
        loadApps();
    </script>
</body>
</html>
