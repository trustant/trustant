<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trustable Debug</title>
    <script src="tailwind.js"></script>
    <link rel="stylesheet" href="trustable-ui.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
    </style>
</head>
<body class="h-full flex flex-col">
    <header class="nu-topbar">
        <div class="px-4 py-3 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <img src="trustable-logo.svg" alt="Trustable Logo" class="w-10 h-10 shrink-0">
                <div class="min-w-0">
                    <p class="nu-mono text-xs font-medium uppercase text-[color:var(--nu-muted)]">Activation stream</p>
                    <h1 class="text-lg font-light text-[color:var(--nu-ink)] truncate">Debug <span id="appName">-</span></h1>
                    <div id="status" class="mt-1 text-xs text-[color:var(--nu-muted)] truncate">Connecting...</div>
                </div>
            </div>
            <div class="flex items-center gap-2 shrink-0">
                <button id="restartBtn" class="nu-btn nu-btn-secondary">Restart</button>
                <button id="stopBtn" class="nu-btn nu-btn-secondary">Stop</button>
                <button onclick="window.close()" class="nu-btn nu-btn-primary">Close</button>
            </div>
        </div>
    </header>
    <main class="flex-1 overflow-hidden p-4">
        <div id="log" class="nu-debug-log nu-code h-full overflow-auto p-4 text-xs leading-relaxed whitespace-pre-wrap"></div>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const appName = params.get('app') || '';
        const logEl = document.getElementById('log');
        const statusEl = document.getElementById('status');
        let eventSource = null;

        document.getElementById('appName').textContent = appName || 'unknown';

        function setStatus(text, className) {
            statusEl.textContent = text;
            statusEl.className = 'mt-1 text-xs truncate ' + (className || 'text-[color:var(--nu-muted)]');
        }

        function appendLine(text, className) {
            const line = document.createElement('div');
            line.textContent = text;
            line.className = className || 'text-[color:var(--nu-ink)]';
            logEl.appendChild(line);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function closeStream() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
        }

        function connect() {
            closeStream();
            logEl.innerHTML = '';
            if (!appName) {
                setStatus('Missing app name', 'text-[color:var(--nu-danger)]');
                appendLine('Missing app name.', 'text-[color:var(--nu-danger)]');
                return;
            }

            setStatus('Connecting...', 'text-[color:var(--nu-muted)]');
            appendLine('$ ops activation poll', 'text-[color:var(--nu-brand)]');
            eventSource = new EventSource('/api/activations/poll?name=' + encodeURIComponent(appName));

            eventSource.onopen = () => {
                setStatus('Connected', 'text-[color:var(--nu-signal)]');
            };

            eventSource.addEventListener('status', (event) => {
                setStatus(event.data, 'text-[color:var(--nu-brand)]');
                appendLine(event.data, 'text-[color:var(--nu-brand)]');
            });

            eventSource.addEventListener('line', (event) => {
                appendLine(event.data);
            });

            eventSource.addEventListener('done', (event) => {
                appendLine(event.data || 'Stopped.', 'text-[color:var(--nu-signal)]');
                setStatus('Stopped', 'text-[color:var(--nu-signal)]');
                closeStream();
            });

            eventSource.addEventListener('error', (event) => {
                if (event.data) {
                    appendLine(event.data, 'text-[color:var(--nu-danger)]');
                    setStatus('Error', 'text-[color:var(--nu-danger)]');
                    closeStream();
                    return;
                }
                setStatus('Disconnected', 'text-[color:var(--nu-signal)]');
            });
        }

        document.getElementById('restartBtn').addEventListener('click', connect);
        document.getElementById('stopBtn').addEventListener('click', () => {
            closeStream();
            setStatus('Stopped', 'text-[color:var(--nu-muted)]');
            appendLine('Stopped by user.', 'text-[color:var(--nu-muted)]');
        });
        window.addEventListener('beforeunload', closeStream);

        connect();
    </script>
</body>
</html>
